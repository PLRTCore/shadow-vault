[project]
name = "shadow-vault"
version = "0.1.0"
description = "Persistent intelligent research memory for Grok with scored retrieval, deduplication, and rediscovery"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "PLRTCore"},
]
keywords = ["grok", "research", "knowledge-base", "second-brain", "memory", "vault"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Knowledge Management",
]

[project.scripts]
shadow-vault = "shadow_vault:main"

[tool.setuptools]
py-modules = ["shadow_vault"]
